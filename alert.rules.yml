groups:
  - name: example_alerts
    rules:
      - alert: HighAppRequestRate
        expr: rate(app_requests_total[1m]) > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High request rate to FastAPI app"
          description: "The FastAPI app is receiving more than 5 requests per second over 1 minute."
